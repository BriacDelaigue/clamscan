<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClamScan</title>
  <style>
    body {
      font-family: Inter, Roboto, Arial, sans-serif;
      margin: 0;
      width: 380px;
      background: #f9f9f9;
      color: #1a202c;
      box-sizing: border-box;
    }

    /* Modal container fills the popup without extra background */
    #clam-modal {
      width: 100%;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      padding: 16px;
      box-sizing: border-box;
    }

    /* Header with logo and buttons */
    #clam-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    #clam-header h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: black;
      flex: 1;
    }

    #clam-buttons {
      display: flex;
      gap: 8px;
      font-size: 15px;
    }

    #clam-buttons button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: black;
    }

    /* File upload */
    #clam-upload {
      border: 2px dashed #CBD5E0;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
      cursor: pointer;
    }

    #clam-upload p {
      margin: 0;
      color: #4A5568;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input[type="file"] {
      display: none;
    }

    /* URL scan */
    #clam-url-input {
      flex: 1;
      padding: 8px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
    }

    #clam-scan-url {
      background: #3182ce;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Scan results */
    #clam-body {
      margin-top: 12px;
      color: #2d3748;
    }

    #clam-file-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #clam-file-info-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #f7fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #2d3748;
      font-size: 24px;
    }

    #clam-filename {
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #clam-extension {
      color: #718096;
      font-size: 14px;
    }

    #clam-details div {
      margin-bottom: 4px;
      font-size: 13px !important;
    }

    #clam-raw {
      background: #f7fafc;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      color: #4a5568;
      white-space: pre-wrap;
      word-break: break-word;
    }

  </style>
</head>
<body>
  <div id="clam-modal">

    <!-- Header with logo and buttons -->
    <div id="clam-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="icon128.png" width="24" height="24" alt="ClamScan Logo" />
        <h3>ClamScan</h3>
      </div>
      <div id="clam-buttons">
        <button id="clam-reload">&#x21bb;</button>
      </div>
    </div>

    <!-- File upload -->
    <div id="clam-upload">
      <p>Drag & drop a file here or click to select</p>
      <input id="clam-file-input" type="file" />
    </div>

    <!-- URL scan -->
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="clam-url-input" placeholder="Paste a download URL" />
      <button id="clam-scan-url">Scan URL</button>
    </div>

    <!-- Scan results -->
    <div id="clam-body">
      <div id="clam-file-info">
        <div id="clam-file-info-icon">📄</div>
        <div>
          <div id="clam-filename">Waiting for file..</div>
          <div id="clam-extension">Extension: -</div>
        </div>
      </div>
      <div id="clam-details">
        <div>Virus name: <span id="clam-virus">-</span></div>
        <div>Size: <span id="clam-size">-</span></div>
        <div>Scan time: <span id="clam-time">-</span></div>
        <div style="margin-top:8px">Raw response:</div>
        <pre id="clam-raw">-</pre>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
